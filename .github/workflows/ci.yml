name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-shared:
    name: shared / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: Win32
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-13
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S src/sqlite -B build -A "${{ matrix.arch }}"
          else
            cmake -S src/sqlite -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Verify artifacts
        shell: bash
        run: |
          set -e
          found=0
          for f in $(find bin -type f \( -name '*.dll' -o -name '*.so' -o -name '*.dylib' \) 2>/dev/null); do
            echo "artifact: $f"
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::no library artifact produced"
            exit 1
          fi

      - name: Upload artifacts (shared)
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite-shared-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error

  build-static:
    name: static / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-13
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Configure
        shell: bash
        run: cmake -S src/sqlite -B build -DBUILD_SHARED_LIBS=OFF ${{ matrix.os == 'Windows' && format('-A {0}', matrix.arch) || '-DCMAKE_BUILD_TYPE=Release' }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Upload artifacts (static)
        uses: actions/upload-artifact@v4
        with:
          name: libsqlite-static-${{ matrix.os }}-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error