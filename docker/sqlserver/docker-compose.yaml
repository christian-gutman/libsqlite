services:

  libsqlite-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: libsqlite-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=Libsqlite#Pass2026!
    ports:
      - "14333:1433"                     # host 14333 -> container 1433
    networks:
      - libsqlite-net
    volumes:
      - libsqlite_mssql_data:/var/opt/mssql/data
      - libsqlite_mssql_log:/var/opt/mssql/log
      - libsqlite_mssql_backup:/var/opt/mssql/backup
      - ./init.sql:/init.sql:ro
      - ./mssql.conf:/var/opt/mssql/mssql.conf:ro
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &
      sleep 15 &&
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Libsqlite#Pass2026!' -C -i /init.sql &&
      wait
      "

networks:
  libsqlite-net:
    name: libsqlite-net
    driver: bridge

volumes:
  libsqlite_mssql_data:
  libsqlite_mssql_log:
  libsqlite_mssql_backup: